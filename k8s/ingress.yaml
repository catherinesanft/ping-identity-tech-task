# To actually reach this at http://stockticker.local, you'll need either:
#   1. "127.0.0.1 stockticker.local" added to /etc/hosts, plus
#      `minikube tunnel` running (needed on macOS with the Docker driver
#      for Ingress/LoadBalancer traffic to reach the cluster at all), or
#   2. skip all that and just use `kubectl port-forward` against the
#      service instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stockticker-ingress
  namespace: default
spec:
  ingressClassName: nginx
  rules:
    - host: stockticker.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stockticker-service
                port:
                  number: 80
